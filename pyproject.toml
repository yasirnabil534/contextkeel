[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "contextkeel"
dynamic = ["version"]
description = "Turn any repo into a self-maintaining agent context workspace."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "contextkeel contributors" }]
keywords = ["ai", "agents", "context", "codebase", "developer-tools"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Build Tools",
]

# The fallback indexer ships by default: the product promise is that the tool
# keeps working when the preferred backend is unavailable, which is only true
# if its replacement is already installed.
dependencies = [
  "typer>=0.12",
  "pydantic>=2.6",
  "ruamel.yaml>=0.18",
  "jinja2>=3.1",
  "platformdirs>=4.2",
  "tree-sitter>=0.23",
  "tree-sitter-language-pack>=0.7",
]

[project.optional-dependencies]
# Named for explicitness; already present in `dependencies` above.
index = ["tree-sitter>=0.23", "tree-sitter-language-pack>=0.7"]
mcp = ["mcp>=2.0"]

[project.urls]
Homepage = "https://github.com/contextkeel/contextkeel"
Documentation = "https://github.com/contextkeel/contextkeel#readme"
Issues = "https://github.com/contextkeel/contextkeel/issues"

# Both names run the same Typer app.
[project.scripts]
contextkeel = "contextkeel.cli.main:main"
ckeel = "contextkeel.cli.main:main"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[tool.hatch.version]
path = "src/contextkeel/__about__.py"

[tool.hatch.build.targets.wheel]
# Data under src/contextkeel (render/content, vault/templates, templates) is
# package data and ships automatically — no force-include needed.
packages = ["src/contextkeel"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PTH"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
# Typer requires option objects as argument defaults; B008 cannot apply here.
"src/contextkeel/cli/main.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
  "network: test requires outbound network access (deselect with -m 'not network')",
  "slow: long-running test",
]

[tool.coverage.run]
source = ["src/contextkeel"]
